<!--
  Lucky Draw — Eat · Drink · Play (open-source demo edition)
  A card-draw decider for food, drinks and days out.
  This public edition ships with 12 sample places; the production deck (253 places),
  production keys and account data are intentionally not included.
  Local mode works out of the box. To enable the shared-account sync, point
  SB_URL / SB_ANON_KEY below at your own Supabase project.
-->
<!doctype html>
<html lang="zh-CN" data-bg="white">
  <head>
    <meta charset="utf-8" />
    <script>/* 首屏前定版：按本机记住的背景/语言先落到 <html> 上，避免闪一下默认粉/中文再切换 */
      try { var __ui = JSON.parse(localStorage.getItem("chwl-ui-v1") || "{}");
        var __okBg = ["pink", "blue", "mint", "cream", "lavender", "graphite", "white", "black", "custom"];
        if (__ui.bg && __okBg.indexOf(__ui.bg) >= 0) document.documentElement.setAttribute("data-bg", __ui.bg);
        else document.documentElement.setAttribute("data-bg", "white"); /* 无记录/记录无效的新访客默认白 */
        /* custom 首屏即挂图：先把 dataURL 注入 CSS 变量，body::after 图层一渲染就是用户图，不闪默认色 */
        if (__ui.bg === "custom" && typeof __ui.bgImg === "string" && (__ui.bgImg.indexOf("data:image/") === 0 || __ui.bgImg.indexOf("https://") === 0))
          document.documentElement.style.setProperty("--bg-img", "url(\"" + __ui.bgImg + "\")");
        var __th = { pink: "#e87ea6", blue: "#64a8f0", mint: "#57c7ab", cream: "#eaa33f", lavender: "#a583e3", graphite: "#93aec6", white: "#64a8f0", black: "#7ab8ff" };
        if (__ui.bg === "custom" && typeof __ui.tintSnap === "string" && __ui.tintSnap) document.documentElement.style.setProperty("--tint", __ui.tintSnap);
        if (__ui.lang === "en") document.documentElement.setAttribute("lang", "en");
      } catch (e) {}</script>
    <script>/* 捕获 CSP 拦截事件（securitypolicyviolation）：登录失败时把被拦的指令与目标如实写进错误文案，区分「发布页策略在拦」与真·网络故障 */
      window.__cspV = [];
      try { document.addEventListener("securitypolicyviolation", function (e) { window.__cspV.push((e.violatedDirective || e.effectiveDirective || "?") + " <- " + (e.blockedURI || "?")); }); } catch (e) {}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" id="colorSchemeMeta" />
    <link rel="icon" href="data:," />
    <!-- 四张分类插画提前预加载：切分类时卡背只做交叉淡入淡出，不等图、不闪白 -->
    <link rel="preload" as="image" href="assets/cat-boba.jpg" />
    <link rel="preload" as="image" href="assets/cat-dessert.jpg" />
    <link rel="preload" as="image" href="assets/cat-play.jpg" />
    <link rel="preload" as="image" href="assets/cat-food.jpg" />
    <title>Lucky Draw</title>
    <style>
      :root {
        /* 本页固定浅粉主题：不跟随系统深色模式翻深 */
        color-scheme: light;
        /* —— 中性基底 —— */
        --bg: #f3d9d3;
        /* 浅粉底：柔和 blush 粉径向渐变（#F7E3DF → #F3D9D3 一带，略带灰调），玻璃层浮在其上 */
        --bg-grad: radial-gradient(130% 85% at 50% -10%, #f7e3df 0%, #f4dbd5 52%, #eed0c8 100%);
        /* 直接落在粉底上的文字（深色，已逐项核过对比度） */
        --on-bg: #33272b;
        --on-bg-soft: #5d484e;
        --on-bg-faint: #775961;
        --surface: #ffffff;
        --surface-2: #f5f5f7;
        --ink: #1d1d1f;
        --ink-soft: #6e6e73;
        --ink-faint: #86868b;
        --line: rgba(0, 0, 0, .08);
        --hairline: rgba(0, 0, 0, .06);
        /* —— 毛玻璃材质（全站统一一套参数） —— */
        --glass: rgba(255, 255, 255, .55);
        --glass-strong: rgba(255, 255, 255, .82);
        --glass-edge: rgba(255, 255, 255, .6);
        --glass-filter: blur(26px) saturate(180%);
        --glass-shadow: 0 12px 40px rgba(0, 0, 0, .12), 0 2px 8px rgba(0, 0, 0, .06);
        --thumb-shadow: 0 3px 10px rgba(0, 0, 0, .22), 0 0 0 .5px rgba(0, 0, 0, .05);
        --shadow: 0 16px 44px rgba(0, 0, 0, .14);
        --shadow-sm: 0 4px 18px rgba(0, 0, 0, .06);
        --scrim: rgba(20, 20, 22, .48);
        /* 全站只用一套中性毛玻璃 + 浅粉底；分类色只用于文字（卡背大字 / 选中 Tab / caps 小字），不铺卡面与按钮 */
        /* —— 分类文字色：低饱和深色调（莫兰迪/灰调），与浅粉底协调 —— */
        --cat-boba: #7c4a2d;    --cat-boba-hi: #a06b45;    --cat-boba-deep: #5f3820;    --cat-boba-soft: #9a6b4f;
        --cat-dessert: #9e445f; --cat-dessert-hi: #b96a83; --cat-dessert-deep: #7e3449; --cat-dessert-soft: #b27087;
        --cat-food: #9a5a34;    --cat-food-hi: #b87f57;    --cat-food-deep: #7a4525;    --cat-food-soft: #b07c55;
        --cat-play: #5e6390;    --cat-play-hi: #7e82ac;    --cat-play-deep: #484c70;    --cat-play-soft: #7d81a6;
        /* —— spring 感曲线 —— */
        --spring: cubic-bezier(.32, .72, 0, 1);       /* 临界阻尼，无回弹 */
        --spring-flip: cubic-bezier(.3, 1.22, .35, 1); /* 翻卡带一点点 overshoot */
        --press: transform 100ms ease-out;
        /* 小提醒前缀走变量：语言切换时由 JS 改写（::before 不能直接读字符串表） */
        --caution-lbl: "小提醒 · ";
        --tint: #64a8f0;
        --tint-soft: color-mix(in srgb, var(--tint) 38%, #ffffff); /* 主题点缀色：随背景预设变（见各 data-bg 块）；custom 时由 JS 按图片主色派生并内联覆盖 */
      }
      /* —— 主页背景预设（面板里切换，写在 <html data-bg> 上）：只换 --bg/--bg-grad 两支，
         全站玻璃材质与墨色不动，任何预设下文字对比度都保持。pink 与 :root 现行值完全一致（默认无感） —— */
      :root[data-bg="pink"]     { --bg: #f3d9d3; --tint: #e87ea6; --bg-grad: radial-gradient(130% 85% at 50% -10%, #f7e3df 0%, #f4dbd5 52%, #eed0c8 100%); }
      :root[data-bg="blue"]     { --bg: #d6dfe9; --tint: #64a8f0; --bg-grad: radial-gradient(130% 85% at 50% -10%, #e9eff5 0%, #dce5ee 52%, #c9d6e4 100%); }
      :root[data-bg="mint"]     { --bg: #d8e9dd; --tint: #57c7ab; --bg-grad: radial-gradient(130% 85% at 50% -10%, #ecf5ee 0%, #dfefe3 52%, #cde3d3 100%); }
      :root[data-bg="cream"]    { --bg: #f0e5cf; --tint: #eaa33f; --bg-grad: radial-gradient(130% 85% at 50% -10%, #faf3e1 0%, #f4ead2 52%, #ecdcba 100%); }
      :root[data-bg="lavender"] { --bg: #ded7ec; --tint: #a583e3; --bg-grad: radial-gradient(130% 85% at 50% -10%, #efeaf7 0%, #e5ddf2 52%, #d3c8e6 100%); }
      :root[data-bg="graphite"] { --bg: #d8d8dc; --tint: #93aec6; --bg-grad: radial-gradient(130% 85% at 50% -10%, #ececef 0%, #dedee2 52%, #cbcbd1 100%); }
      /* —— 苹果白：近纯白底。只换底色玻璃会糊在白底上，故在覆盖块里同时把玻璃提实、
         描边（--line/--hairline）与阴影（--glass-shadow/--shadow/--shadow-sm）的存在感加强；
         文字仍用现有深色墨系 —— */
      :root[data-bg="white"] {
        --bg: #f5f5f7;
        --tint: #64a8f0;
        --bg-grad: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
        --glass: rgba(255, 255, 255, .72);
        --glass-strong: rgba(255, 255, 255, .94);
        --glass-edge: rgba(255, 255, 255, .9);
        --line: rgba(0, 0, 0, .13);
        --hairline: rgba(0, 0, 0, .10);
        --glass-shadow: 0 12px 40px rgba(0, 0, 0, .10), 0 2px 8px rgba(0, 0, 0, .09);
        --thumb-shadow: 0 3px 10px rgba(0, 0, 0, .20), 0 0 0 .5px rgba(0, 0, 0, .10);
        --shadow: 0 16px 44px rgba(0, 0, 0, .16);
        --shadow-sm: 0 4px 18px rgba(0, 0, 0, .10);
      }
      /* —— 深夜黑：整套变量翻深（color-scheme: dark 在此声明，meta 由 applyBg 同步）。
         写死的浅色专用颜色逐处走查后的修复全部落在下方 black 作用域段内，
         浅色主题逐像素不变 —— */
      :root[data-bg="black"] {
        color-scheme: dark;
        --bg: #000000;
        --tint: #7ab8ff;
        --bg-grad: radial-gradient(130% 85% at 50% -10%, #2c2c2e 0%, #131315 52%, #000000 100%);
        --on-bg: #f5f5f7;
        --on-bg-soft: rgba(245, 245, 247, .72);
        --on-bg-faint: rgba(245, 245, 247, .48);
        --surface: #1c1c1e;
        --surface-2: #2c2c2e;
        --ink: #f5f5f7;
        --ink-soft: #aeaeb2;
        --ink-faint: #8e8e93;
        --line: rgba(255, 255, 255, .14);
        --hairline: rgba(255, 255, 255, .10);
        --glass: rgba(28, 28, 30, .55);
        --glass-strong: rgba(28, 28, 30, .85);
        --glass-edge: rgba(255, 255, 255, .16);
        --glass-shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .42);
        --thumb-shadow: 0 3px 10px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .12);
        --shadow: 0 16px 44px rgba(0, 0, 0, .55);
        --shadow-sm: 0 4px 18px rgba(0, 0, 0, .42);
        --scrim: rgba(0, 0, 0, .62);
      }
      /* 分类文字色只在页面区域（顶栏选中 Tab）单独提亮；卡面插画上的融合字走
         .face-back 的 --cat 变量链，不经这里、不受影响 */
      :root[data-bg="black"] .tab.on[data-pool="boba"] { color: #d9a678; }
      :root[data-bg="black"] .tab.on[data-pool="dessert"] { color: #e08aa5; }
      :root[data-bg="black"] .tab.on[data-pool="food"] { color: #dfa06d; }
      :root[data-bg="black"] .tab.on[data-pool="play"] { color: #a3a8d9; }
      /* —— 自定义图片：底图走 body::after 全屏 cover 固定层（图源 = --bg-img 变量），
         body::before 的 --bg-grad 在此改作一层浅色淡蒙层压在图上，
         chrome（顶栏/图鉴/面板）保持浅色主题不变、只换底图 —— */
      :root[data-bg="custom"] {
        --bg: #f3d9d3;
        --bg-grad: linear-gradient(180deg, rgba(247, 227, 223, 0) 0%, rgba(247, 227, 223, 0) 100%);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      html { background: var(--bg); }
      /* 自定义图模式下，同一张壁纸也画到 html 上（背景会传播到画布）：回弹时 bar
         上方露出的画布区域显示的是壁纸本身，而不是与壁纸无关的扁平底色——顶栏
         延伸层在上面做毛玻璃时采样到的背景与 bar 本体一致，不再有色差 */
      html[data-bg="custom"] { background-image: var(--bg-img, none); background-size: cover; background-position: center; background-repeat: no-repeat; }
      body::before {
        /* 固定粉底层：整页同色系渐变，滚动时不移动，衬托毛玻璃 */
        content: ""; position: fixed; inset: 0; z-index: -1;
        background: var(--bg-grad);
      }
      /* 自定义图层：z-index -2 压在蒙层（body::before, -1）之下；仅 custom 时绘制，
         图源由 JS/head 脚本写入 --bg-img 变量，无图时不显示、不影响任何预设 */
      body::after {
        content: ""; position: fixed; inset: 0; z-index: -2; display: none;
        background-image: var(--bg-img, none); background-size: cover; background-position: center;
      }
      :root[data-bg="custom"] body::after { display: block; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
        letter-spacing: 0;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }
      /* 手机端禁止整页横向滑动/错位：根元素同样裁剪 + 关掉横向 overscroll（纵向弹性不受影响） */
      html { overflow-x: clip; }
      html, body { overscroll-behavior-x: none; }

      /* ---------- 顶部毛玻璃栏 + 分段控件 ---------- */
      /* 顶部 bar = Apple Maps sheet 式头部面板：大面积毛玻璃、大圆角下摆，
         里面依次是小字眉题 + 大号粗体标题 + 分类分段控件，都收在这块 bar 里 */
      .topbar {
        position: sticky; top: 0; z-index: 40;
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        border-radius: 0 0 28px 28px;
        box-shadow: inset 1px 0 0 rgba(255, 255, 255, .25), inset -1px 0 0 rgba(255, 255, 255, .25), inset 0 -1px 0 rgba(255, 255, 255, .25), 0 14px 34px rgba(84, 48, 54, .14), 0 3px 10px rgba(84, 48, 54, .07);
      }
      /* 顶栏玻璃向上延伸 200px（回弹时盖住 bar 上方露出的画布条带）：与 bar 同底色、
         同一 backdrop 模糊；顶边高光与左右描边由延伸层接棒（bar 本体已摘掉顶边线），
         接缝处无任何线条——延伸层与 bar 看起来就是一整块玻璃 */
      .topbar::before {
        content: ""; position: absolute; left: 0; right: 0; top: -200px; height: 200px;
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge), inset 1px 0 0 rgba(255, 255, 255, .25), inset -1px 0 0 rgba(255, 255, 255, .25);
        pointer-events: none;
      }
      :root[data-bg="black"] .topbar::before { box-shadow: inset 0 1px 0 var(--glass-edge), inset 1px 0 0 rgba(255, 255, 255, .08), inset -1px 0 0 rgba(255, 255, 255, .08); }
      .topbar-inner { max-width: 600px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 14px; }
      @media (min-width: 760px) { .topbar-inner { max-width: 680px; } }
      .head-eyebrow { font-size: 13px; font-weight: 600; color: var(--ink-soft); letter-spacing: .04em; margin-left: 2px; }
      .seg {
        position: relative; display: flex; padding: 3px; border-radius: 12px;
        background: rgba(120, 120, 128, .14);
      }
      .seg-thumb {
        position: absolute; top: 3px; left: 3px; height: calc(100% - 6px);
        width: calc((100% - 6px) / 4); border-radius: 9px;
        /* 选中态只用中性白玻璃 + 顶部高光，不带任何分类色 */
        background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, .5));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), var(--thumb-shadow);
        transition: transform .45s var(--spring), background-color .3s ease;
      }
      .tab {
        position: relative; z-index: 1; flex: 1; border: none; background: transparent;
        padding: 7px 2px; cursor: pointer; font-family: inherit;
        font-size: 14px; font-weight: 500; color: var(--ink-soft);
        display: flex; align-items: baseline; justify-content: center; gap: 4px;
        border-radius: 9px; transition: color .25s ease, transform .3s var(--spring);
        white-space: nowrap;
      }
      /* 英文模式排版适配：Tab 短词不换行、字号略收；图鉴店名给两行，避免长英文名溢出或硬截断 */
      body.lang-en .tab { font-size: 13px; letter-spacing: -.01em; }
      body.lang-en .gcard .gname { line-height: 15px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; padding-top: 2px; }
      .tab .cnt { font-size: 11px; font-weight: 500; opacity: .65; font-variant-numeric: tabular-nums; }
      .tab.on { color: var(--ink); font-weight: 600; }
      .tab.on .cnt { opacity: .85; }
      /* 选中态 Tab 文字用对应分类色（未选中保持深灰） */
      .tab.on[data-pool="boba"] { color: var(--cat-boba); }
      .tab.on[data-pool="dessert"] { color: var(--cat-dessert); }
      .tab.on[data-pool="food"] { color: var(--cat-food); }
      .tab.on[data-pool="play"] { color: var(--cat-play); }
      .tab:active { transform: scale(.97); }

      .wrap {
        max-width: 600px; margin: 0 auto; padding: 22px 16px 64px;
        /* filter 不进 transition：灯箱关闭时整页 saturate 若逐帧动画，iOS 要把整页过一遍滤镜重绘，
           卡片 340ms 落位后页面还在滤镜动画里 grind 到 550ms、末帧还要整页重栅格化——就是落点那一卡。
           saturate 改为随 lb-open 瞬时生效/摘除（都在遮罩下发生、肉眼无感），逐帧只留 composited 的 transform */
        transition: transform .34s var(--spring);
      }
      @media (min-width: 760px) { .wrap { max-width: 680px; } }
      body.lb-open .wrap { transform: scale(.982); filter: saturate(.94); }
      /* 灯箱打开期间锁住背景页纵向滚动（桌面滚轮/键盘/滚动条）；iOS 触摸链由灯箱 JS 守卫兜底 */
      body.lb-open { overflow: hidden; }

      /* —— 头部面板里的大标题「Lucky Draw」：Maps sheet 式大号粗体，压在毛玻璃面板上用深色实字 —— */
      .page-title {
        margin: 3px 0 15px 2px; font-size: 34px; font-weight: 800; line-height: 1.12; letter-spacing: -0.015em;
        color: var(--ink);
        position: relative; display: inline-block; filter: url(#chalkTitle);
      }

      /* —— 卡背分类色变量：标题与胶囊的文字色随当前分类走（低饱和深色调，压在浅色插画上可读） —— */
      .face-back { --cat: var(--cat-boba); --cat-hi: var(--cat-boba-hi); --cat-deep: var(--cat-boba-deep); --cat-soft: var(--cat-boba-soft); }
      .face-back[data-pool="dessert"] { --cat: var(--cat-dessert); --cat-hi: var(--cat-dessert-hi); --cat-deep: var(--cat-dessert-deep); --cat-soft: var(--cat-dessert-soft); }
      .face-back[data-pool="food"] { --cat: var(--cat-food); --cat-hi: var(--cat-food-hi); --cat-deep: var(--cat-food-deep); --cat-soft: var(--cat-food-soft); }
      .face-back[data-pool="play"] { --cat: var(--cat-play); --cat-hi: var(--cat-play-hi); --cat-deep: var(--cat-play-deep); --cat-soft: var(--cat-play-soft); }
      /* ---------- 抽卡舞台 ---------- */
      .stage { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
      .stage-slot { position: relative; width: min(300px, 68vw); aspect-ratio: 3 / 4; }
      .card3d { position: absolute; inset: 0; perspective: 1200px; transition: opacity .25s ease, transform .4s var(--spring); }
      .stage-slot.drawing .card3d { opacity: 0; pointer-events: none; }
      /* —— 抽卡卡堆：该品类真实卡面叠放，循环换牌 —— */
      .deck {
        position: absolute; inset: 0; opacity: 0; transform: scale(.965); pointer-events: none;
        transition: opacity .3s ease, transform .4s var(--spring);
      }
      .stage-slot.drawing .deck { opacity: 1; transform: none; }
      .deck-card {
        position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: var(--surface);
        box-shadow: 0 20px 46px rgba(84, 48, 54, .28), 0 4px 14px rgba(84, 48, 54, .18);
        transform: translateY(12px) scale(.94); opacity: 0;
        transition-property: transform, opacity; transition-timing-function: var(--spring), ease;
        will-change: transform;
      }
      .deck-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card3d.flipped { cursor: zoom-in; }
      .card3d:not(.flipped) { cursor: pointer; }
      .card-inner {
        position: absolute; inset: 0; transform-style: preserve-3d;
        transition: transform .62s var(--spring-flip);
        will-change: transform;
      }
      .card3d.flipped .card-inner { transform: rotateY(180deg); }
      .face {
        position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
        border-radius: 20px; overflow: hidden; box-shadow: var(--shadow);
      }
      .face-back {
        /* 卡背 = 当前分类的水彩插画打底：轻微虚化 + 一层磨砂罩，插画仍是主角、整体更柔和高级；
           内容仿 Apple Maps 卡片：分类名大号粗体压在图上、沉到左下，文字与画面融为一体 */
        background: #f6efe7;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), inset 0 0 0 1px rgba(255, 255, 255, .35), 0 20px 46px rgba(84, 48, 54, .24), 0 4px 14px rgba(84, 48, 54, .14);
        color: var(--on-bg);
      }
      /* 插画层：四张图常驻叠放，虚化调到很轻（画面保持清晰、只留一点柔焦），
         切换时靠 opacity 交叉淡入淡出——图早已全部加载好，切换不等图、不闪白 */
      .back-art {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
        transform: scale(1.02);
        filter: blur(0.6px) saturate(1.04) brightness(1.02);
        opacity: 0; transition: opacity .45s ease;
      }
      .back-art.on { opacity: 1; }
      /* 磨砂罩：整卡一层极轻的雾面提亮（毛玻璃气质），底部渐入更实的雾白把分类名托起来——
         像 Maps 卡片底部那层自然的虚化压暗，只是这里插画底色浅、反过来用雾白 */
      .back-frost {
        position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, .05) 42%, rgba(255, 252, 248, .38) 68%, rgba(255, 252, 248, .78) 88%, rgba(255, 252, 248, .88) 100%);
        -webkit-backdrop-filter: blur(0.7px) saturate(1.1);
        backdrop-filter: blur(0.7px) saturate(1.1);
      }
      /* 卡内只剩两部分：分类名 + 「抽一张」，都沉到左下、左对齐（Maps 式排版） */
      .back-ui {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: flex-start; justify-content: flex-end; gap: 16px; padding: 24px 22px 26px;
      }
      /* 分类名整体比胶囊再往右挪一点点，与下方「抽一张」的字视觉对齐（胶囊本身位置不动） */
      .back-cat { text-align: left; margin-left: 4px; }
      .back-cat .en {
        font-size: 13px; font-weight: 700; letter-spacing: .3em; text-indent: .02em;
        color: var(--cat); line-height: 1.3;
      }
      .back-cat .zh {
        margin-top: 5px; font-size: 54px; font-weight: 800; line-height: 1.08; letter-spacing: .01em;
        color: var(--cat-deep);
        text-shadow: 0 1px 0 rgba(255, 255, 255, .55), 0 10px 26px rgba(255, 252, 248, .65);
      }
      /* 抽卡触发并入卡面：分类名下方的玻璃胶囊，抽卡开始瞬间淡出 */
      .draw-capsule {
        cursor: pointer; font-family: inherit;
        border: 1px solid rgba(255, 255, 255, .65);
        background: rgba(255, 255, 255, .52);
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75), 0 8px 22px rgba(84, 48, 54, .16);
        color: var(--on-bg); font-size: 17px; font-weight: 700; letter-spacing: .14em; text-indent: .14em;
        padding: 13px 38px; border-radius: 999px;
        transition: opacity .25s ease, transform .25s var(--spring), background-color .25s ease, box-shadow .25s ease;
      }
      .draw-capsule:active { transform: scale(.96); }
      .draw-capsule.gone { opacity: 0; transform: scale(.9); pointer-events: none; }
      /* —— 首页三层分类卡堆 deck3：常驻三层、C 位当前分类、左右露邻类；只动 transform/opacity 保 60fps —— */
      .deck3 {
        position: absolute; inset: 0; z-index: 3;
        opacity: 0; visibility: hidden; transform: scale(.965);
        transition: opacity .34s ease, transform .5s var(--spring), visibility 0s linear .34s;
        pointer-events: none; touch-action: pan-y;
        -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      .stage-slot.deck-on .deck3 { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition: opacity .34s ease, transform .5s var(--spring); }
      .stage-slot.deck-on .card3d { opacity: 0; pointer-events: none; }
      .layer3 {
        position: absolute; inset: 0; border-radius: 20px; overflow: hidden; background: #f6efe7;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), inset 0 0 0 1px rgba(255, 255, 255, .35), 0 20px 46px rgba(84, 48, 54, .24), 0 4px 14px rgba(84, 48, 54, .14);
        will-change: transform, opacity;
      }
      .layer3[data-pool="boba"] { --cat: var(--cat-boba); --cat-hi: var(--cat-boba-hi); --cat-deep: var(--cat-boba-deep); --cat-soft: var(--cat-boba-soft); }
      .layer3[data-pool="dessert"] { --cat: var(--cat-dessert); --cat-hi: var(--cat-dessert-hi); --cat-deep: var(--cat-dessert-deep); --cat-soft: var(--cat-dessert-soft); }
      .layer3[data-pool="food"] { --cat: var(--cat-food); --cat-hi: var(--cat-food-hi); --cat-deep: var(--cat-food-deep); --cat-soft: var(--cat-food-soft); }
      .layer3[data-pool="play"] { --cat: var(--cat-play); --cat-hi: var(--cat-play-hi); --cat-deep: var(--cat-play-deep); --cat-soft: var(--cat-play-soft); }
      .layer3-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.02); filter: blur(0.6px) saturate(1.04) brightness(1.02); pointer-events: none; }
      .layer3-frost { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(255, 255, 255, .14) 0%, rgba(255, 255, 255, .05) 42%, rgba(255, 252, 248, .38) 68%, rgba(255, 252, 248, .78) 88%, rgba(255, 252, 248, .88) 100%); }
      .layer3-ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 16px; padding: 24px 22px 26px; pointer-events: none; will-change: opacity; }
      /* 抽一张胶囊：每张分类卡自带一颗（在 .back-ui / .layer3-ui 流内），随卡面一起移动、淡入淡出 */
      /* 卡堆上的胶囊禁用实时毛玻璃：四颗模糊层骑在每帧移动的卡上会逼浏览器逐帧重采样重模糊，是掉帧主因；改用更高不透明度的白（下方卡图本身已磨砂，观感近乎不变） */
      .draw-capsule.layer-cap { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 255, 255, .82); }
      .face-front { transform: rotateY(180deg); background: var(--surface); }
      .face-front img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .round-info { margin-top: 16px; font-size: 13px; color: var(--on-bg-soft); min-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
      .round-info b { color: var(--on-bg); font-weight: 600; }

      /* ---------- 结果 ---------- */
      .result {
        margin-top: 24px; background: var(--surface); border: 1px solid var(--line);
        border-radius: 20px; padding: 20px; box-shadow: var(--shadow-sm);
        display: none;
      }
      .result.show { display: block; animation: rise .45s var(--spring); }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .result h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; }
      .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip {
        font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px;
        background: var(--surface-2); color: var(--ink-soft);
      }
      .chip.star { background: rgba(0, 0, 0, .07); color: var(--ink); }
      .musttry { margin-top: 14px; }
      .musttry .lbl { font-size: 12px; font-weight: 600; color: var(--ink-faint); letter-spacing: .08em; }
      .musttry ul { margin: 7px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
      .musttry li { font-size: 13.5px; font-weight: 500; background: rgba(0, 0, 0, .055); border-radius: 9px; padding: 5px 10px; }
      .note { margin: 13px 0 0; font-size: 14.5px; line-height: 1.65; }
      .caution { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--ink-soft); }
      .caution::before { content: var(--caution-lbl); font-weight: 600; }
      .addr { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--hairline); }
      .addr span { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
      /* —— 动作按钮（结果面板 + 图鉴灯箱共用一套）：白色毛玻璃，与「抽一张」胶囊同款材质；上下等宽排列，不并排 —— */
      .act-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
      .act-btn {
        display: flex; align-items: center; justify-content: center; gap: 9px;
        width: 100%; padding: 12px 18px; border-radius: 999px;
        text-decoration: none; font-size: 14.5px; font-weight: 600; color: var(--on-bg);
        border: 1px solid rgba(255, 255, 255, .55);
        background: rgba(255, 255, 255, .42);
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75), inset 0 0 0 1px rgba(84, 48, 54, .05), 0 8px 22px rgba(84, 48, 54, .16);
        transition: var(--press), background-color .25s ease, box-shadow .25s ease;
      }
      .act-btn:active { transform: scale(.97); }
      .act-btn svg { width: 19px; height: 19px; flex: none; }
      .act-btn.hide { display: none; }
      /* 无链接时的禁用态按钮：与正常态同一套玻璃材质与几何（高度/宽度/间距不变），只置灰降透明、不可点 */
      .act-btn.na {
        opacity: .48; cursor: default;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 4px 12px rgba(84, 48, 54, .10);
      }
      .act-btn.na:active { transform: none; }
      .act-btn.na svg { opacity: .65; }

      /* ---------- 统计 ---------- */
      .stats { display: flex; gap: 10px; margin-top: 26px; }
      .stat {
        flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
        padding: 13px 6px; text-align: center; box-shadow: var(--shadow-sm);
      }
      .stat .num { font-size: 22px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
      .stat .lbl { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

      /* ---------- 区块标题 ---------- */
      .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 32px 2px 12px; }
      .sec-head h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--on-bg); }
      .sec-head .sub { font-size: 12px; color: var(--on-bg-soft); }

      /* ---------- 图鉴标题行：标题 + 小箭头（点标题一键展开/收起全部） ---------- */
      .atlas-head { justify-content: flex-start; align-items: center; gap: 8px; }
      .atlas-toggle {
        display: inline-flex; align-items: baseline; gap: 5px;
        background: none; border: none; padding: 0; margin: 0; cursor: pointer;
        font-family: inherit; color: var(--on-bg); text-align: left;
        transition: var(--press);
      }
      .atlas-toggle:active { transform: scale(.97); }
      .atlas-h { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
      /* Maps「Recents ›」式小箭头：次级灰、细线条、与标题基线对齐，只是标题的一部分 */
      .atlas-chev { font-size: 20px; font-weight: 300; line-height: 1; color: var(--on-bg-faint); }
      /* ---------- 图鉴手风琴 ---------- */
      .acc { margin-bottom: 14px; }
      .acc-head {
        /* interactive 玻璃标题栏：与顶栏同一套材质参数 */
        width: 100%; display: flex; align-items: center; gap: 10px;
        padding: 14px 16px; cursor: pointer;
        font-family: inherit; color: var(--ink); text-align: left;
        background-color: var(--glass);
        background-image: linear-gradient(115deg, rgba(255, 255, 255, 0) 35%, rgba(255, 255, 255, .28) 50%, rgba(255, 255, 255, 0) 65%);
        background-size: 240% 100%; background-position: 115% 0;
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        border: 1px solid var(--hairline); border-radius: 16px;
        box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-sm);
        transition: background-position .7s var(--spring), var(--press);
      }
      @media (hover: hover) { .acc-head:hover { background-position: -15% 0; } }
      .acc-head:active { transform: scale(.98); background-position: -15% 0; }
      .acc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: rgba(0, 0, 0, .28); }
      .acc-name { font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; }
      .acc-meta { margin-left: auto; font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .acc-head .chev { width: 16px; height: 16px; flex: none; color: var(--ink-faint); transform: rotate(-90deg); transition: transform .45s var(--spring); }
      .acc.open .acc-head .chev { transform: rotate(0deg); }
      .acc-body {
        display: grid; grid-template-rows: 0fr;
        transition: grid-template-rows .72s var(--spring);
      }
      .acc.open .acc-body { grid-template-rows: 1fr; }
      .acc-inner { overflow: hidden; min-height: 0; }
      /* 筛选面板打开期间，本分类 .acc-inner 解除 overflow 裁切：面板是向下伸展的绝对定位层，
         命中很少时（如只剩 3 家）网格很矮，面板底部（状态行）会探出 inner 底边被裁掉看不见；
         面板关闭即恢复 hidden，手风琴展开/收起动画的裁切不受影响（关面板总是先于收起分类发生） */
      .acc.fopen .acc-inner { overflow: visible; }
      /* 展开动画落定后（.settled，由 JS 在 transitionend / 兜底计时加上）同样解除裁切：
         工具行吸顶（position: sticky）要求祖先链无 overflow 裁切才对视口生效；
         收起开始即摘掉 settled 恢复 hidden，收起动画的裁切不受影响 */
      .acc.open.settled .acc-inner { overflow: visible; }
      .acc-inner .gallery, .acc-inner .acc-empty, .acc-inner .pager { margin: 10px 2px 2px; }
      .acc-empty { font-size: 13.5px; color: var(--ink-soft); padding: 6px 0 2px; }

      /* 图鉴小卡几何刚性统一（四分类同一套）：网格行列距固定 10px；图片区固定宽高比 cover；
         店名行固定高度 33px、行高同高使文字垂直居中；卡片内边距四边 0、店名左右内边距固定 8px */
      .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      @media (min-width: 760px) { .gallery { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
      .gcard {
        position: relative; display: flex; flex-direction: column; margin: 0;
        border-radius: 14px; overflow: hidden; cursor: zoom-in;
        border: 1px solid var(--line); background: var(--surface); padding: 0;
        font-family: inherit; text-align: left; transition: var(--press), box-shadow .25s ease;
      }
      .gcard:active { transform: scale(.97); }
      .gcard img { flex: none; width: 100%; aspect-ratio: 1080 / 740; object-fit: cover; display: block; opacity: 0; transition: opacity .38s ease; }
      .gcard img.ld { opacity: 1; }
      .gcard .gname {
        flex: none; height: 33px; line-height: 33px; padding: 0 8px; margin: 0;
        font-size: 12px; font-weight: 500; color: var(--ink);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* 图鉴翻面控制：只在分类超过一面（12 张）时出现在网格下方，全站同一套玻璃小圆钮 + 面数指示 */
      .pager { display: flex; align-items: center; justify-content: center; gap: 14px; }
      .pager-btn {
        width: 32px; height: 32px; border-radius: 50%; flex: none; padding: 0;
        display: flex; align-items: center; justify-content: center;
        font-family: inherit; color: var(--ink-soft); cursor: pointer;
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        border: 1px solid var(--glass-edge);
        box-shadow: inset 0 1px 0 var(--glass-edge), 0 2px 8px rgba(84, 48, 54, .10);
        transition: var(--press), background-color .25s ease, opacity .25s ease, color .25s ease;
      }
      .pager-btn svg { width: 15px; height: 15px; }
      .pager-btn:active { transform: scale(.92); }
      .pager-btn:disabled { opacity: .35; cursor: default; }
      .pager-btn:disabled:active { transform: none; }
      .pager-info { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 62px; text-align: center; }
      .empty {
        border: 1px solid var(--line); border-radius: 18px; padding: 28px 20px; text-align: center;
        color: var(--ink-soft); background: var(--surface); font-size: 14px; line-height: 1.7;
      }

      /* ---------- 次数榜 / 记录 ---------- */
      .rank { background: var(--card-glass); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); overflow: hidden; }
      .history { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); overflow: hidden; }
      .rank { padding: 4px 16px; }
      .rank-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; border-bottom: 1px solid var(--hairline); }
      .rank-row:last-child { border-bottom: none; }
      .rank-row .n { font-weight: 500; }
      .rank-row .c { font-weight: 600; color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; }
      .hrow { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--hairline); font-size: 14px; }
      .hrow:last-child { border-bottom: none; }
      .hrow .t { color: var(--ink-faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .hrow .p { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
      .p-boba, .p-dessert, .p-play, .p-food { background: rgba(0, 0, 0, .06); color: var(--ink-soft); }
      .hrow .n { font-weight: 500; flex: 1; line-height: 1.4; }
      .hempty { padding: 22px 16px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
      .clear-btn {
        /* regular 玻璃：次要按钮，清透无 tint */
        border: 1px solid var(--hairline); background: var(--glass); color: var(--ink-soft); cursor: pointer;
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge);
        font-family: inherit; font-size: 13px; font-weight: 500; border-radius: 999px; padding: 6px 14px;
        transition: var(--press), opacity .2s, background-color .25s ease, color .25s ease;
      }
      .clear-btn:active { transform: scale(.97); }
      .clear-btn:disabled { opacity: .4; cursor: not-allowed; }
      .more-note { text-align: center; font-size: 12px; color: var(--on-bg-soft); margin-top: 8px; }

      /* ---------- 弹层（毛玻璃 materialize） ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 50; padding: 20px;
        display: none; align-items: center; justify-content: center;
        background: var(--scrim);
        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      }
      .overlay.show { display: flex; animation: scrim-in .3s ease; }
      @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
      .modal {
        background: var(--glass-strong);
        -webkit-backdrop-filter: var(--glass-filter);
        backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge), var(--glass-shadow);
        border: 1px solid var(--hairline);
        border-radius: 24px; padding: 24px 22px; max-width: 340px; width: 100%; text-align: center;
      }
      .overlay.show .modal { animation: materialize .38s var(--spring); }
      @keyframes materialize {
        from { opacity: 0; transform: scale(.94) translateY(10px); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: blur(0); }
      }
      .modal h4 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      .modal p { margin: 0 0 20px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
      .modal .row { display: flex; gap: 10px; }
      .mbtn {
        flex: 1; border-radius: 999px; padding: 11px; font-family: inherit; font-size: 15px; font-weight: 500;
        cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        transition: var(--press), background-color .25s ease;
      }
      .mbtn:active { transform: scale(.96); }
      .mbtn.danger { background: #ff3b30; border-color: #ff3b30; color: #fff; font-weight: 600; }

      /* ---------- 灯箱 ---------- */
      .overlay.lb { padding: 0; }
      /* 关闭瞬间摘掉遮罩色与模糊：卡片直接在原本的页面上缩回格子，飞行全程背景零色调变化。
         遮罩若留到落位（330ms 后）才随 display:none 硬切，整屏会先被暗层压着、再突然亮——就是那一闪。

      .lb-tray { position: absolute; left: 0; right: 0; bottom: 0; justify-content: space-between; z-index: 8; display: flex; gap: 7px; padding: 9px 12px; border-radius: 999px; background: linear-gradient(155deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02) 55%, rgba(255, 255, 255, .05)); border: 1px solid rgba(255, 255, 255, .30); box-shadow: 0 14px 30px rgba(15, 12, 8, .22), inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -10px 18px rgba(255, 255, 255, .06); -webkit-backdrop-filter: blur(11px) saturate(1.5); backdrop-filter: blur(11px) saturate(1.5); opacity: 0; pointer-events: none; transform: translateY(12px) scale(.94); transform-origin: 50% 100%; transition: transform .38s var(--spring), opacity .2s ease; }

        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; padding: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(120, 120, 128, .22); color: var(--ink-soft);
        font-family: inherit; font-size: 15px; line-height: 1;
        transition: var(--press), background-color .2s ease;
      }
      .cat-search-clear.hide { display: none; }
      .cat-search-clear:active { transform: translateY(-50%) scale(.9); }
      .cat-count { font-size: 12.5px; color: var(--on-bg-soft); margin-top: 7px; font-variant-numeric: tabular-nums; }
      .cat-count.hide { display: none; }

      /* ---------- 自选池编辑面板 ---------- */
      .cp-modal {
        max-width: 520px; text-align: left; display: flex; flex-direction: column; max-height: 86vh;
        /* 卡片尺寸恒定：不随筛选命中多少变化，列表区内部伸缩、页脚永远贴底 */
        height: min(780px, calc(100dvh - 40px));
        /* 自选池面板（含内部筛选区）比通用弹层更通透一档：底色更薄、模糊更足，筛选区与列表一起透出玻璃感 */
        background: rgba(255, 255, 255, .6);
        -webkit-backdrop-filter: blur(32px) saturate(195%); backdrop-filter: blur(32px) saturate(195%);
      }
      .cp-grab { align-self: center; width: 100%; height: 24px; margin: -10px 0 2px; display: flex; align-items: flex-start; justify-content: center; cursor: grab; touch-action: none; flex: none; }
      .cp-grab span { width: 64px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.32); }
      :root[data-bg="black"] .cp-grab span { background: rgba(235,235,245,.32); }
      .cp-grab:active { cursor: grabbing; }
      .cp-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
      .cp-top h4 { margin: 0; }
      .cp-count { font-size: 13px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .cp-hint { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-faint); line-height: 1.55; }
      /* ---------- 自选池选择器内筛选：默认收起，只露一颗与图鉴同款的筛选 pill（滑杆图标 + 「筛选」+ 已选角标），
         点开才展开筛选框，收起时把竖向空间让给下面的店铺列表；筛选框内 chips 与图鉴同一套语言
         （组内 OR、组间 AND），状态独立于图鉴筛选；只改变列表可见项，不动已勾选 ---------- */
      .cp-fbar { flex: none; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .cp-fwrap { position: relative; display: inline-flex; flex: none; }
      .cp-fpill { height: 38px; padding: 0 13px; font-size: 13.5px; }
      /* 展开动画只走 opacity + transform：高度动画会让框内玻璃模糊逐帧重算，出现颜色漂移与卡顿（the author 2026-10-22） */
      .cp-fpanel { flex: none; display: none; margin-bottom: 0; }
      .cp-fpanel.open { display: block; margin-bottom: 10px; animation: cpFIn .22s var(--spring); }
      @keyframes cpFIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
      .cp-fpanel-in { overflow: hidden; min-height: 0; }
      .cp-fbox {
        background: rgba(255, 255, 255, .42); border: 1px solid rgba(255, 255, 255, .55); border-radius: 16px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7);
        padding: 10px 12px 2px;
      }
      .cp-fbox .frow { margin-bottom: 8px; }
      .cp-fbox .fchip { font-size: 12px; padding: 4px 9px; }
      .fchip.cp-more { background: color-mix(in srgb, var(--tint) 26%, #ffffff); border: 1px solid color-mix(in srgb, var(--tint) 42%, rgba(255, 255, 255, .55)); color: #36332e; font-weight: 600; }
      /* 筛选框限高：展开再长也只占面板一部分高度，框内自己滚，店铺列表与页脚永远留在框内 */
      .cp-fpanel.open .cp-fpanel-in { overflow-y: auto; max-height: min(42dvh, 400px); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
      .cp-fpanel.open .cp-fpanel-in::-webkit-scrollbar { display: none; }
      /* 状态行沉到筛选框最底部（命中数 + 全选当前筛选结果 + 清除筛选），与上方 chips 之间一条 hairline 分隔 */
      .cp-fhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; margin-bottom: 5px; padding-top: 10px; border-top: 1px solid var(--hairline); }
      .cp-fhit { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .cp-facts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
      .cp-fbtn {
        border: 1px solid var(--hairline); background: var(--glass); color: var(--ink-soft); cursor: pointer;
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge);
        font-family: inherit; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 4px 12px;
        transition: var(--press), background-color .25s ease, color .25s ease;
      }
      .cp-fbtn:active { transform: scale(.95); }
      .cp-fbtn.hide { display: none; }
      .cp-fbtn:disabled { opacity: .4; cursor: default; }
      .cp-fbtn:disabled:active { transform: none; }
      .cp-fbox .frow:last-of-type { margin-bottom: 0; }
      .cp-list { flex: 1 1 auto; overflow-y: auto; min-height: 0; margin: 0 -6px; padding: 0 6px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
      /* 自选池打开期间，滚动只许发生在 .cp-list 内：遮罩与卡体本身不参与滚动链，背景页纹丝不动（JS 侧另有 touchmove/wheel 守卫兜住 iOS 的链式滚动） */
      #poolOverlay, .cp-modal, #lightboxOverlay { overscroll-behavior: contain; }
      .cp-group { margin-bottom: 14px; }
      .cp-ghead { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px 4px; }
      .cp-gname { font-size: 14px; font-weight: 600; }
      .cp-gmeta { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .cp-gact { margin-left: auto; display: flex; gap: 12px; }
      .cp-link { border: none; background: none; cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 500; color: var(--on-bg-soft); padding: 2px; }
      .cp-link:active { opacity: .55; }
      .cp-row {
        display: flex; align-items: center; gap: 10px; padding: 7px 4px; cursor: pointer;
        border-bottom: 1px solid var(--hairline); font-size: 14px;
      }
      .cp-group .cp-row:last-child { border-bottom: none; }
      .cp-check { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; flex: none; margin: 0; cursor: pointer; border: 1.5px solid rgba(120, 120, 128, .45); background: rgba(255, 255, 255, .35); transition: background-color .18s ease, border-color .18s ease, transform .12s ease; }
      .cp-check:checked { background: #34c759; border-color: #34c759; }
      .cp-check:active { transform: scale(.88); }
      .cp-rname { flex: 1; min-width: 0; line-height: 1.35; }
      .cp-foot { display: flex; gap: 10px; margin-top: 14px; }
      .mbtn.primary { background: color-mix(in srgb, var(--tint) 34%, #eae3d7); border: 1px solid color-mix(in srgb, var(--tint) 45%, rgba(255, 255, 255, .55)); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -10px 18px rgba(255, 255, 255, .10), 0 6px 18px color-mix(in srgb, var(--tint) 22%, transparent); color: #36332e; font-weight: 600; }
      .mbtn.primary:disabled { opacity: .38; cursor: not-allowed; }
      .mbtn.primary:disabled:active { transform: none; }

      /* ---------- 悬停反馈：可点元素轻轻放大 + 玻璃提亮（仅真悬停设备，触屏不触发） ---------- */
      @media (hover: hover) and (pointer: fine) {
        /* 顶栏分类 Tab：文字转深 + 微微放大 */
        .tab:hover { color: var(--ink); transform: scale(1.05); }
        /* 待抽的卡片本身：整卡轻轻浮起一点，提示可点 */
        .card3d:not(.flipped):hover { transform: scale(1.015); }
        /* 「抽一张」胶囊：放大 + 玻璃更亮、投影加深 */
        .draw-capsule:hover {
          transform: scale(1.045); background: rgba(255, 255, 255, .6);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), 0 12px 28px rgba(84, 48, 54, .22);
        }
        /* 导航 / 看菜单等动作按钮：放大 + 玻璃更亮、投影加深（禁用态 N/A 按钮不参与悬停反馈） */
        .act-btn:not(.na):hover {
          transform: scale(1.02); background: rgba(255, 255, 255, .64);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 0 0 1px rgba(84, 48, 54, .05), 0 12px 28px rgba(84, 48, 54, .22);
        }
        /* 图鉴卡片：放大 + 一道柔影 */
        .gcard:hover { transform: scale(1.03); box-shadow: 0 10px 24px rgba(84, 48, 54, .18); }
        /* 图鉴分类标题栏：投影加深（扫光效果已有） */
        .acc-head:hover { box-shadow: inset 0 1px 0 var(--glass-edge), 0 8px 24px rgba(84, 48, 54, .12); }
        /* 清空记录：放大 + 提亮、文字转深 */
        .clear-btn:hover { transform: scale(1.04); color: var(--ink); background: rgba(255, 255, 255, .78); }
        .clear-btn:disabled:hover { transform: none; color: var(--ink-soft); background: var(--glass); }
        /* 弹层按钮：放大；危险按钮再压深一档红 */
        .mbtn:hover { transform: scale(1.03); }
        .mbtn.danger:hover { background: #e0332a; border-color: #e0332a; }
        /* 灯箱圆形按钮：放大 + 底色更亮 */
        .lb-btn:hover { transform: scale(1.1); }
        /* 图鉴翻面钮：放大 + 玻璃更亮（禁用态不参与） */
        .pager-btn:not(:disabled):hover { transform: scale(1.08); background: rgba(255, 255, 255, .78); }
      }

      /* ---------- 顶栏头像按钮：圆形玻璃钮，钉在顶栏右上角（标题/分段控件布局不动） ---------- */
      .topbar-inner { position: relative; }
      .avatar-btn {
        position: absolute; top: calc(38px + env(safe-area-inset-top, 0px)); right: 20px; width: 42px; height: 42px; border-radius: 50%;
        padding: 0; cursor: pointer; overflow: hidden; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-family: inherit; font-size: 17px; font-weight: 700; color: #fff;
        background: var(--glass);
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        border: 1px solid var(--glass-edge);
        box-shadow: inset 0 1px 0 var(--glass-edge), 0 4px 14px rgba(84, 48, 54, .14);
        transition: var(--press), background-color .25s ease;
      }
      .avatar-btn:active { transform: scale(.93); }
      .avatar-btn svg { width: 21px; height: 21px; color: var(--ink-soft); display: block; }
      .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .avatar-btn .av-init { line-height: 1; }
      @media (hover: hover) and (pointer: fine) { .avatar-btn:hover { transform: scale(1.06); background: rgba(255, 255, 255, .78); } }

      /* ---------- 头像面板（顶栏下方垂落的 dropdown 风毛玻璃）：五项 设置/历史/统计/语言/背景 ----------
         锚点改到顶部：遮罩层用 padding 把面板钉在顶栏下沿之下。顶栏高 ≈151px（内边距 20+14 +
         眉题 19.5 + 标题 3+38+15 + 分段控件 41），故 padding-top = 151 + 10 间距 = 161px；
         面板右缘与头像按钮右缘对齐——顶栏内容列宽 600px（≥760px 时 680px）、列内右 padding 20px、
         头像钮 right:20px，故右内边距 = (100% - 列宽)/2 + 20px（用 % 而非 vw，滚动条宽度不带偏）；移动端左右各留 12px、面板近全宽。
         开/合动画与灯箱同法：只在共同祖先 .sheet 上放一套 transition（opacity .34s ease +
         transform .34s spring、零 delay），页签与全部内部控件作为子孙被同一变换带着走、整组同步；
         遮罩淡入淡出用同一时长与曲线；JS 只设起止行内状态与关闭计时（见 openPanel/closePanel）。
         max-height 按「视口 - 顶部 161 - 底部安全间距 19」收，内容过高时 .sheet-body 内部纵向滚动。 */
      .overlay.sheet-ov {
        z-index: 56; align-items: flex-start; justify-content: flex-end;
        padding: 161px 12px 14px;
        transition: opacity .34s ease;
      }
      @media (min-width: 640px) { .overlay.sheet-ov { padding-left: 14px; padding-right: calc((100% - 600px) / 2 + 20px); } }
      /* 手机端：左右只留 6px、底部 9px，面板近全宽；max-height 从 -180 放宽到 -175（161 顶锚 + 9 底 + 5 余量），
         玻璃改强模糊高饱和 + 更通透底色（黑/白主题各有专属底色，文字对比不降） */
      @media (max-width: 639px) {
        .overlay.sheet-ov { padding-top: 118px; padding-left: 3px; padding-right: 3px; padding-bottom: 6px; }
        .sheet {
          max-height: calc(100vh - 126px); max-height: calc(100dvh - 126px);
          background: rgba(255, 255, 255, .74);
          -webkit-backdrop-filter: blur(36px) saturate(200%); backdrop-filter: blur(36px) saturate(200%);
        }
        :root[data-bg="black"] .sheet { background: rgba(28, 28, 30, .60); }
        :root[data-bg="white"] .sheet { background: rgba(255, 255, 255, .68); }
      }
      @media (min-width: 760px) { .overlay.sheet-ov { padding-right: calc((100% - 680px) / 2 + 20px); } }
      .sheet {
        width: 100%; max-width: 560px; display: flex; flex-direction: column;
        max-height: calc(100vh - 180px); max-height: calc(100dvh - 180px);
        background: var(--glass-strong);
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        border: 1px solid var(--hairline); border-radius: 26px;
        box-shadow: inset 0 1px 0 var(--glass-edge), var(--glass-shadow);
        overflow: hidden; text-align: left;
        transition: opacity .34s ease, transform .34s var(--spring);
        will-change: opacity, transform;
      }
      .sheet-head {
        flex: none; display: flex; align-items: center; gap: 10px;
        padding: 8px 14px 10px; touch-action: none;
      }
      /* 五页签 = iOS 风胶囊分段条：单个胶囊容器、选中项填充胶囊高亮、项间细分隔线、
         每项图标 + 短标签。容器高度写死 42px 且在 .sheet-head（flex:none）内——切页签
         只换 .sheet-body 内容，tab bar 本体零重排、y 坐标恒定 */
      .sheet-tabs {
        flex: 1; display: flex; align-items: stretch; height: 42px; padding: 3px; border-radius: 999px; min-width: 0;
        background: rgba(120, 120, 128, .14);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .03);
        contain: layout style;
      }
      .stab {
        position: relative; flex: 1; min-width: 0; border: none; background: transparent; cursor: pointer; font-family: inherit;
        display: flex; align-items: center; justify-content: center; gap: 4px;
        padding: 0 2px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--ink-soft);
        white-space: nowrap; transition: color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .25s var(--spring);
      }
      .stab svg { width: 15px; height: 15px; flex: none; }
      .stab span { line-height: 1; }
      .stab + .stab::before {
        content: ""; position: absolute; left: 0; top: 22%; height: 56%; width: 1px;
        background: rgba(120, 120, 128, .38); transition: opacity .15s ease;
      }
      .stab.on::before, .stab.on + .stab::before { opacity: 0; }
      .stab:active { transform: scale(.96); }
      .stab.on {
        color: var(--ink); font-weight: 600;
        background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), var(--thumb-shadow);
      }
      /* 顶部抓握条：面板不再有 ×，关闭靠拖拽手势——整条可抓，横杠只是视觉提示；
         touch-action:none 保证触摸拖动不被页面滚动/下拉刷新抢走（正文滚动区 .sheet-body 不受影响） */
      .sheet-grab { flex: none; display: flex; justify-content: center; padding: 9px 0 2px; cursor: grab; touch-action: none; }
      .sheet-grab:active { cursor: grabbing; }
      .sheet-grab-pill { width: 64px; height: 5px; border-radius: 999px; background: rgba(120, 120, 128, .42); pointer-events: none; }
      :root[data-bg="black"] .sheet-grab-pill { background: rgba(255, 255, 255, .34); }
      .sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 18px 22px; min-height: 0; }
      .spanel.hide { display: none; }
      /* 页签内容切换只做 opacity/transform 的合成层淡入（display 切换会重启本动画），不做高度动画、不触发 tab bar 重排 */
      .spanel { animation: spanel-in .18s ease; }
      @keyframes spanel-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
      .spanel .stats { margin-top: 6px; }
      .spanel .sec-head { margin: 22px 2px 12px; }
      .psec { margin-top: 18px; }
      .psec:first-child { margin-top: 6px; }
      .psec-t { margin: 0 0 10px 2px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
      .panel-note { margin: 9px 2px 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
      .guide-box {
        border: 1px dashed rgba(0, 0, 0, .14); border-radius: 14px; padding: 14px 15px;
        font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); background: rgba(255, 255, 255, .35);
      }

      /* 面板内表单件：输入框/主按钮/次按钮，与全站玻璃语言一致 */
      .fld {
        width: 100%; height: 44px; border-radius: 12px; padding: 0 14px;
        font-family: inherit; font-size: 14.5px; color: var(--ink);
        background: rgba(255, 255, 255, .65); border: 1px solid var(--line);
        outline: none; -webkit-appearance: none; appearance: none;
      }
      .fld:focus { background: #fff; border-color: rgba(0, 0, 0, .22); }
      .fld::placeholder { color: var(--ink-faint); }
      #loginForm .fld + .fld { margin-top: 10px; }
      /* 密码框：外层相对定位容器（与邮箱框同距 10px），右侧内嵌显示/隐藏密码小眼睛；
         确认密码框与密码框共用这一套，可见状态由同一个开关一起翻 */
      .pw-wrap { position: relative; margin-top: 10px; }
      .pw-wrap .fld { padding-right: 48px; }
      .pw-eye {
        position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
        width: 40px; height: 40px; border: none; border-radius: 10px; padding: 0;
        background: none; cursor: pointer; color: var(--ink-soft);
        display: flex; align-items: center; justify-content: center;
      }
      .pw-eye svg { width: 20px; height: 20px; display: block; }
      .pw-eye:active { opacity: .55; }
      .auth-switch {
        display: block; margin: 12px auto 2px; padding: 2px 6px; border: none; background: none; cursor: pointer;
        font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
        text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(0, 0, 0, .25);
      }
      .auth-switch:active { opacity: .55; }
      .fld-row { display: flex; gap: 8px; }
      .fld-row .fld { flex: 1; min-width: 0; }
      .pbtn {
        flex: none; height: 44px; border-radius: 12px; padding: 0 18px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 600;
        background: #1d1d1f; border: 1px solid #1d1d1f; color: #fff;
        transition: var(--press), opacity .2s ease, background-color .25s ease;
      }
      .pbtn:active { transform: scale(.96); }
      .pbtn:disabled { opacity: .4; cursor: default; }
      .pbtn:disabled:active { transform: none; }
      .pbtn.ghost { background: var(--glass); border-color: var(--hairline); color: var(--ink); font-weight: 500;
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge); }
      .pbtn.block { width: 100%; margin-top: 10px; }
      .pbtn.ghost.danger-txt { color: #c2261d; }
      .pbtn.danger { background: #ff3b30; border-color: #ff3b30; color: #fff; font-weight: 600; }
      /* 退出登录专用：不整颗红底——普通按钮同款毛玻璃底，只把文字标红（the author 参考 Apple 账户设置） */
      #signOutBtn { background: var(--glass); border-color: var(--hairline); color: #e0241c;
        -webkit-backdrop-filter: var(--glass-filter); backdrop-filter: var(--glass-filter);
        box-shadow: inset 0 1px 0 var(--glass-edge); }
      .form-msg { margin: 9px 2px 0; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
      .form-msg.ok { color: #1d6f42; }
      .form-msg.err { color: #c2261d; }
      .acct-id { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .acct-av { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 21px; font-weight: 700; color: #fff; background: rgba(120, 120, 128, .35); }
      .acct-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .acct-av svg { width: 26px; height: 26px; color: var(--ink-soft); }
      /* 设置页头像框本身可点（label 包住隐藏的 file input）：点圆框即换头像，不再单列文字按钮 */
      .acct-av-btn { cursor: pointer; transition: var(--press), box-shadow .25s ease; }
      .acct-av-btn:active { transform: scale(.93); }
      @media (hover: hover) and (pointer: fine) { .acct-av-btn:hover { box-shadow: 0 0 0 2px var(--glass-edge), 0 4px 12px rgba(84, 48, 54, .16); } }
      .acct-meta { min-width: 0; }
      .acct-name { font-size: 15.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .acct-mail { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mini-lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ink-faint); letter-spacing: .05em; margin: 12px 2px 6px; }
      .code-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
      .code-big {
        font-size: 22px; font-weight: 800; letter-spacing: .22em; font-variant-numeric: tabular-nums;
        background: rgba(255, 255, 255, .65); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 18px;
      }
      .member-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; font-size: 14px; }
      .member-av { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex: none;
        display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; background: rgba(120, 120, 128, .35); }
      .member-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .member-tag { margin-left: auto; font-size: 11.5px; color: var(--ink-faint); }

      /* 双人档案：按周分组的记录行 */
      .week-t { margin: 16px 2px 8px; font-size: 12.5px; font-weight: 700; color: var(--on-bg-soft); letter-spacing: .03em; }
      .week-t:first-child { margin-top: 2px; }
      .visit {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 12px 14px; margin-bottom: 9px; box-shadow: var(--shadow-sm);
      }
      .visit-top { display: flex; align-items: baseline; gap: 8px; }
      .visit-name { font-size: 19px; font-weight: 800; letter-spacing: -.01em; flex: 1; min-width: 0; line-height: 1.3; }
      .visit-date { font-size: 12px; color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .visit-del { border: none; background: none; cursor: pointer; font-family: inherit; font-size: 12.5px; color: #c2261d; padding: 2px 0 2px 6px; flex: none; }
      .visit-del:active { opacity: .55; }
      .visit-scores { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
      .score-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .score-chip .member-av { width: 24px; height: 24px; font-size: 10.5px; }
      .score-chip.none { color: var(--ink-faint); font-weight: 500; }
      button.score-chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px 3px 4px; cursor: pointer; font-family: inherit; transition: var(--press); }
      button.score-chip:active { transform: scale(.95); }
      .visit-avg { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .visit-avg b { color: var(--ink); font-size: 13.5px; }
      .score-picker { display: none; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
      .score-picker.show { display: flex; }
      .score-n {
        width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
        background: var(--surface); font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
        transition: var(--press), background-color .2s ease, color .2s ease;
      }
      .score-n:active { transform: scale(.9); }
      .score-n.on { background: #1d1d1f; border-color: #1d1d1f; color: #fff; }
      /* 弧形评分：半圆弧轨道 + 可拖圆钮，左 1 右 5；拖动实时跟手，松手弹簧吸附到整分，
         中间大数字与称号随分弹出（Q 弹缓动 cubic-bezier(.30,1.45,.64,1)） */
      .arc-wrap { position: relative; width: 100%; max-width: 290px; margin: 6px auto 2px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
      .arc-svg { display: block; width: 100%; height: auto; }
      .arc-track { fill: none; stroke: rgba(120, 120, 128, .20); stroke-width: 30; stroke-linecap: round; }
      .arc-fill { fill: none; stroke: color-mix(in srgb, var(--tint) 74%, #ffffff); opacity: .75; stroke-width: 30; stroke-linecap: round; transition: stroke-dashoffset .62s cubic-bezier(.30,1.75,.64,1); }
      .arc-wrap.dragging .arc-fill { transition: none; }
      .arc-knob { position: absolute; width: 25px; height: 25px; border-radius: 50%; background: color-mix(in srgb, var(--tint) 40%, rgba(255, 255, 255, .50)); border: 3px solid #fff; box-shadow: inset 0 1px 2px rgba(255, 255, 255, .65), inset 0 -4px 8px rgba(255, 255, 255, .18), 0 3px 10px rgba(0, 0, 0, .22); transform: translate(-50%, -50%); transition: left .62s cubic-bezier(.30,1.75,.64,1), top .62s cubic-bezier(.30,1.75,.64,1); pointer-events: none; z-index: 2; }
      .arc-wrap.dragging .arc-knob { transition: none; transform: translate(-50%, -50%) scale(1.3); }
      .arc-center { position: absolute; left: 0; right: 0; top: 57%; transform: translateY(-50%); text-align: center; pointer-events: none; }
      .arc-num { font-size: 42px; font-weight: 800; line-height: 1; color: color-mix(in srgb, var(--tint) 82%, #ffffff); font-variant-numeric: tabular-nums; }
      .arc-word { font-size: 19px; font-weight: 700; color: color-mix(in srgb, var(--tint) 82%, #ffffff); margin-top: 3px; }
      .arc-word.w1 { font-size: 27px; } /* 单字称号（如「夯」）视觉偏小，单独放大 */
      .arc-num.pop, .arc-word.pop { animation: arcPop .6s cubic-bezier(.30,1.75,.64,1); }
      @keyframes arcPop { 0% { transform: scale(.4); } 55% { transform: scale(1.22); } 100% { transform: scale(1); } }
      .arc-end { position: absolute; top: 90%; font-size: 11px; font-weight: 600; color: var(--ink-faint); pointer-events: none; }
      .arc-end-l { left: 5%; } .arc-end-r { right: 5%; }
      :root[data-bg="black"] .arc-track { stroke: rgba(255, 255, 255, .16); }
      @media (prefers-reduced-motion: reduce) { .arc-fill, .arc-knob { transition: none; } .arc-num.pop, .arc-word.pop { animation: none; } }
      /* 双档选择：两个选项并排（档位 1 = 账号本人，档位 2 = 第二位共用者），选中态用实色描边区分 */
      .slot-row { display: flex; gap: 8px; margin-top: 2px; }
      .slot-opt { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); text-align: left; transition: var(--press), border-color .2s ease, background-color .2s ease, color .2s ease; }
      .slot-opt:active { transform: scale(.97); }
      .slot-opt.on { color: var(--ink); background: var(--surface-2); }
      .slot-row .slot-opt:first-child.on { border-color: #a9cdf2; box-shadow: 0 0 0 3px rgba(169, 205, 242, .35), var(--thumb-shadow); }
      .slot-row .slot-opt:last-child.on { border-color: #f2b3c6; box-shadow: 0 0 0 3px rgba(242, 179, 198, .38), var(--thumb-shadow); }
      :root[data-bg="black"] .slot-row .slot-opt:first-child.on { border-color: #5b84b8; box-shadow: 0 0 0 3px rgba(91, 132, 184, .35), var(--thumb-shadow); }
      :root[data-bg="black"] .slot-row .slot-opt:last-child.on { border-color: #b87a92; box-shadow: 0 0 0 3px rgba(184, 122, 146, .38), var(--thumb-shadow); }
      .slot-opt .member-av { width: 28px; height: 28px; font-size: 12px; }
      .slot-opt .member-av svg { width: 16px; height: 16px; }
      .slot-opt .slot-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .slot-picker-wrap { margin-top: 10px; }
      .slot-picker-wrap .score-picker { margin-top: 8px; }
      .score-chip .chip-name { max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
      /* 评分 chip 按人着色：User 1浅蓝 / User 2粉（与设置页双头像环同色系） */
      .score-chip.s1 { color: #5ea3ec; }
      .score-chip.s2 { color: #e87ea6; }
      :root[data-bg="black"] .score-chip.s1 { color: #7ab8ff; }
      :root[data-bg="black"] .score-chip.s2 { color: #ffa4c4; }
      /* 平均分徽章：粉笔手写风（主题色掺白 + 粉尘光晕 + SVG 粗糙边缘 + 呼吸脉动示意可点），点开地点详情 */
      .avg-badge { position: absolute; z-index: 3; font-family: "Chalkboard SE", "Bradley Hand", Georgia, "Times New Roman", serif; font-weight: 700; line-height: 1; color: var(--tint); color: color-mix(in srgb, var(--tint) 36%, #ffffff); transform: rotate(-5deg); cursor: pointer; padding: 3px 5px 6px; text-shadow: 0 0 1px rgba(255,255,255,.55), 0 0 6px rgba(255,255,255,.85), 0 0 15px rgba(255,255,255,.55), 1px 1px 2px rgba(0,0,0,.3); filter: url(#chalk); animation: badgePulse 2.4s ease-in-out infinite alternate; transition: transform .25s cubic-bezier(.30,1.45,.64,1); }
      .avg-badge[hidden] { display: none; }
      .avg-badge:active { animation: none; transform: rotate(-5deg) scale(1.2); }
      .avg-badge::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: 0; height: 3px; border-radius: 2px; background: currentColor; opacity: .5; transform: rotate(-1.5deg); filter: blur(.4px); }
      @keyframes badgePulse { from { transform: rotate(-5deg) scale(1); } to { transform: rotate(-3.6deg) scale(1.07); } }
      .avg-badge.unrated { color: #9a9aa0; color: color-mix(in srgb, var(--ink-faint) 80%, #ffffff); animation-duration: 3.4s; }
      .avg-badge.unrated::after { display: block; background: var(--tint-soft); opacity: .85; }
      @media (prefers-reduced-motion: reduce) { .avg-badge { animation: none; } }
      .gcard .avg-badge { right: 6px; bottom: 4px; font-size: 25px; }
      .gcard .avg-badge.unrated { font-size: 13.5px; letter-spacing: .06em; }
      .gcard:has(.avg-badge) .gname { padding-right: 66px; }
      .gcard:has(.avg-badge.unrated) .gname { padding-right: 64px; }
      .face-front .avg-badge { right: 16px; bottom: 16px; font-size: 46px; }
      .face-front .zoom-hint { position: absolute; top: 10px; left: 10px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.55); backdrop-filter: blur(6px) saturate(1.35); -webkit-backdrop-filter: blur(6px) saturate(1.35); box-shadow: 0 2px 8px rgba(60,45,20,.16), inset 0 0 0 1px rgba(255,255,255,.55); color: #4a4238; pointer-events: none; }
      .face-front .zoom-hint[hidden] { display: none; }
      .face-front .zoom-hint svg { width: 17px; height: 17px; display: block; }
      .face-front .avg-badge.unrated { font-size: 22px; }
      .lb-stage .avg-badge { right: 16px; bottom: 16px; font-size: 44px; z-index: 6; }
      .lb-stage .avg-badge.unrated { font-size: 21px; }
      /* 地点详情页：总结 + 历次记录时间线 */
      body.pd-open { overflow: hidden; }
      #pdOverlay { z-index: 55; padding: 14px; }
      .pd-card { position: relative; width: 100%; max-width: 430px; max-height: calc(100dvh - 36px); overflow-y: auto; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); border: 1px solid var(--line); box-shadow: var(--shadow-lg); padding: 24px 20px 18px; }
      .pd-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; padding: 0; }
      .pd-close svg { width: 15px; height: 15px; }
      .pd-kicker { font-size: 11px; letter-spacing: .14em; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; }
      .pd-name { font-size: 23px; font-weight: 800; letter-spacing: -.01em; margin-top: 3px; padding-right: 34px; }
      .pd-sub { font-size: 13px; color: var(--ink-faint); margin-top: 3px; }
      .pd-avgrow { display: flex; align-items: baseline; gap: 10px; margin-top: 12px; }
      .pd-bigavg { font-family: "Chalkboard SE", "Bradley Hand", Georgia, "Times New Roman", serif; font-weight: 700; font-size: 66px; margin-left: 3px; line-height: 1; color: var(--tint); color: color-mix(in srgb, var(--tint) 36%, #ffffff); transform: rotate(-3deg); display: inline-block; filter: url(#chalk); text-shadow: 0 0 1px rgba(255,255,255,.4), 1px 1px 2px rgba(0,0,0,.18); }
      .pd-bigavg.unrated { font-size: 38px; color: #9a9aa0; color: color-mix(in srgb, var(--ink-faint) 80%, #ffffff); }
      .pd-avglbl { font-size: 13px; color: var(--ink-faint); font-weight: 600; }
      .pd-stats { font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
      .pd-slots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .pd-slotavg { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px 3px 4px; }
      .pd-slotavg .member-av { width: 22px; height: 22px; font-size: 10px; }
      .pd-slotavg.s1 { color: #5ea3ec; }
      .pd-slotavg.s2 { color: #e87ea6; }
      :root[data-bg="black"] .pd-slotavg.s1 { color: #7ab8ff; }
      :root[data-bg="black"] .pd-slotavg.s2 { color: #ffa4c4; }
      .pd-tl { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
      .pd-visit { border: 1px solid var(--line); background: var(--card-glass); border-radius: 16px; padding: 12px 14px; }
      .pd-vhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .pd-vdate { font-size: 14.5px; font-weight: 700; }
      .pd-vavg { font-size: 12.5px; color: var(--ink-faint); font-weight: 600; white-space: nowrap; }
      .pd-vchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .pd-visit .score-chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px 3px 4px; }
      .pd-norate { font-size: 12.5px; color: var(--ink-faint); }
      .pd-actions { display: flex; gap: 8px; margin-top: 16px; }
      .pd-actions .act-btn { flex: 1; justify-content: center; }
      .pd-add-btn { width: 100%; margin-top: 16px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--tint) 34%, #eae3d7); border: 1px solid color-mix(in srgb, var(--tint) 45%, rgba(255, 255, 255, .55)); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -10px 18px rgba(255, 255, 255, .10), 0 6px 18px color-mix(in srgb, var(--tint) 22%, transparent); color: #36332e; font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; transition: var(--press); }
      .pd-add-btn:active { transform: scale(.98); }
      /* 设置里的点缀色选择器：色板与背景预设严格一致 */
      .tint-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .tint-opt { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: inherit; transition: var(--press); min-width: 0; }
      .tint-opt:active { transform: scale(.96); }
      .tint-opt.on { border-color: var(--tint); box-shadow: 0 0 0 1.5px var(--tint); }
      .tint-dot { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.08); }
      .tint-name { font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .note-input { width: 100%; box-sizing: border-box; margin-top: 9px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font: inherit; font-size: 13.5px; color: var(--ink); resize: none; }
      .note-input:focus { outline: none; border-color: var(--tint-soft); }
      .note-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
      .note-actions .pbtn { flex: none; background: none; border: none; box-shadow: none; padding: 8px 6px; font-size: 16.5px; font-weight: 600; color: var(--tint-soft); }
      .note-actions .pbtn.danger { background: none; border: none; color: #e0241c; }
      .note-actions .pbtn[data-savescore] { font-weight: 700; color: var(--tint); }
      :root[data-bg="black"] .note-actions .pbtn { background: none; border: none; }
      :root[data-bg="black"] .note-actions .pbtn.danger { background: none; border: none; color: #ff6961; }
      /* iOS 输入聚焦防放大：<16px 的输入框被点中时 Safari 会自动放大整页，统一 16px 规避 */
      input[type="search"], input[type="text"], input[type="email"], input[type="password"], textarea { font-size: 16px !important; }
      .visit-notes { margin-top: 7px; display: grid; gap: 3px; }
      .vnote { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft); margin: 0; overflow-wrap: anywhere; }
      .vnote b { color: var(--ink); font-weight: 600; }

      /* —— 设置页双头像：本人浅蓝环 / 副账号粉环，点头像换照片、点名字改名字 —— */
      .acct-pair { display: flex; gap: 30px; align-items: flex-start; margin: 2px 2px 4px; }
      .acct-person { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 78px; }
      .acct-person .acct-av { width: 60px; height: 60px; font-size: 24px; }
      .acct-person .acct-av svg { width: 30px; height: 30px; }
      .ring-me { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 0 0 4.5px #a9cdf2; }
      .ring-p2 { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 0 0 4.5px #f2b3c6; }
      :root[data-bg="black"] .ring-me { box-shadow: 0 0 0 2px rgba(28, 28, 30, .9), 0 0 0 4.5px #5b84b8; }
      :root[data-bg="black"] .ring-p2 { box-shadow: 0 0 0 2px rgba(28, 28, 30, .9), 0 0 0 4.5px #b87a92; }
      .acct-name-btn { border: none; background: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); padding: 2px 2px; max-width: 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .acct-name-btn .edit-ico { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
      .acct-name-btn:active { opacity: .55; }
      .pair-hint { font-size: 12px; color: var(--ink-faint); margin: 8px 2px 0; }

      /* —— 历史页蓝字分段清空 —— */
      .clear-block { margin-top: 14px; }
      .clear-link { border: none; background: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: #e0241c; padding: 4px 2px; transition: opacity .2s; }
      :root[data-bg="black"] .clear-link { color: #ff6961; }
      .clear-link:active { opacity: .55; }
      .clear-link:disabled { color: var(--ink-faint); cursor: default; }
      .clear-opts { margin-top: 6px; overflow: hidden; }
      .clear-opts .gin { border-top: 1px solid var(--hairline); }
      .clear-opts.hide { display: none; }
      .clear-opt { display: flex; width: 100%; align-items: baseline; gap: 8px; border: none; border-bottom: 1px solid var(--hairline); background: none; cursor: pointer; font-family: inherit; font-size: 14px; color: var(--tint-soft); padding: 10px 2px; text-align: left; }
      :root[data-bg="black"] .clear-opt { color: var(--tint-soft); }
      .clear-opt .n { margin-left: auto; font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .clear-opt:disabled { color: var(--ink-faint); cursor: default; }
      .clear-opt:active { opacity: .55; }
      .clear-opt:disabled:active { opacity: 1; }

      /* —— 双人档案日历：有记录的日期下加小横线、今天圈起来，点日期滑进当天页 —— */
      .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
      .cal-title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }

      /* 历史页内容多：切到历史页签时面板拉满——高度撑满、底边贴到屏幕底（switchTab 给浮层加 .tall） */
      .overlay.sheet-ov.tall { padding-bottom: 0; }
      .overlay.sheet-ov.tall .sheet { height: 100%; max-height: none; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

      .cal-back { display: inline-flex; align-items: center; gap: 5px; background: var(--glass); border: 1px solid var(--hairline); box-shadow: var(--shadow-sm); color: color-mix(in srgb, var(--tint) 86%, #ffffff); padding: 7px 15px 7px 10px; border-radius: 999px; margin-bottom: 12px; transition: var(--press), opacity .2s; }

      /* 下拉展开/收起统一走高度过渡：grid-template-rows 0fr<->1fr，.65s 缓动，
         切换只切 .open 类、不重渲染（重渲染出的新元素会直接落在终态、没有动画） */
      .gwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .65s cubic-bezier(.32,.72,0,1); }

      .cal-day.has .cal-num { position: relative; }
      .dpick-none { display: block; width: 100%; margin-top: 8px; padding: 9px 0 2px; border: none; border-top: 1px solid var(--line); background: none; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--tint-soft); cursor: pointer; }

      /* 保存记录主按钮走主题配色（跟随 --tint），不再黑底 */
      #avSave { background: color-mix(in srgb, var(--tint) 34%, #eae3d7); border: 1px solid color-mix(in srgb, var(--tint) 45%, rgba(255, 255, 255, .55)); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -10px 18px rgba(255, 255, 255, .10), 0 6px 18px color-mix(in srgb, var(--tint) 22%, transparent); color: #36332e; }
      .pbtn.add-visit { background: color-mix(in srgb, var(--tint) 34%, #eae3d7); border: 1px solid color-mix(in srgb, var(--tint) 45%, rgba(255, 255, 255, .55)); backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), inset 0 -10px 18px rgba(255, 255, 255, .10), 0 6px 18px color-mix(in srgb, var(--tint) 22%, transparent); color: #36332e; }
      .av-opt { display: block; width: 100%; text-align: left; border: none; background: none; cursor: pointer;
        font-family: inherit; font-size: 14px; padding: 8px 6px; border-bottom: 1px solid var(--hairline); color: var(--ink); }

      /* 语言分段 + 背景色板 */
      .lang-seg { display: flex; padding: 3px; border-radius: 12px; background: rgba(120, 120, 128, .14); margin-top: 6px; }

      .lang-seg button:active { transform: scale(.97); }

        background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, .6));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), var(--thumb-shadow); }
      .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 8px; }

        -webkit-appearance: none; appearance: none; text-align: center; color: var(--ink);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .07);

      .swatch.on::after { content: "\2713"; position: absolute; top: 5px; right: 5px; z-index: 3;
        width: 19px; height: 19px; border-radius: 50%; background: #1d1d1f; color: #fff;

        box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }

      /* 第 9 格 = 自定义图：无图是上传格（+ 图标 + 「自定义」），有图图片填满整格、

      .sw-custom { background: rgba(120, 120, 128, .14); }

        display: flex; align-items: center; justify-content: center; transition: var(--press); }

      /* ---------- 展开同时自动滚动：把展开的分类送进视口，卡片铺满主画面 ----------
