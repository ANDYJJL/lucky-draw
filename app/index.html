         同一条缓动曲线，任何一段先走完都会被看成「等展开完才下滑」或「滚到了还在长」。
         上一版走浏览器原生平滑滚动：它的时长与曲线由浏览器自定、与展开的 0.5s 完全
         脱钩；且点击那一帧页面还没长高，原生滚动的目标先被当时的最大滚动量钳短，
         真正到位的是展开收尾后 580ms 的那次补滚——体感正是两段式。
         现改为逐帧自驱滚动：与 .acc-body 的展开过渡共用时长 720ms 与同一条
         cubic-bezier(.32,.72,0,1)（--spring）。终点在点击帧即可算准——展开只向下
         长，分类顶边的文档坐标恒定，终点 = 顶边文档坐标 − gap（顶栏高 + 8，头行
         贴顶栏下方、第一张卡连店名完整可见）。每帧按缓动进度在起终点间做绝对定位
         （不是增量叠加）：页面未长够而被钳住的帧，下一帧随文档长高自动补齐，两段
         动画锁相推进、同一帧落位。末帧再做一次实测校正，兜住页面总高不足的钳制
         （最后一个分类）。用户中途滚轮/触摸立即取消自驱，把滚动还给用户。

      var accScrollTimer = 0, accScrollRAF = 0;

         （牛顿迭代解参数 t，二分兜底） */
      function springEase(x) {
        var X1 = 0.32, Y1 = 0.72, X2 = 0, Y2 = 1;
        function bx(t) { var u = 1 - t; return 3 * u * u * t * X1 + 3 * u * t * t * X2 + t * t * t; }
        function by(t) { var u = 1 - t; return 3 * u * u * t * Y1 + 3 * u * t * t * Y2 + t * t * t; }

        for (i = 0; i < 6; i++) {

      /* 展开终点：整块（分类头 + 搜索/筛选行 + 本面 12 tile + 分页行）的最终几何在
         点击帧即可算准——顶边文档坐标恒定、展开区最终高取 .acc-inner.scrollHeight
         （裁剪中也始终是内容全高）。目标 = 区块中心尽量对齐视口中心，同时顶边
         永不钻进顶栏之下（钳到 gap = 顶栏高 + 8）；整块高于可用视口时也落到
         gap，露出尽可能多的 tile */
      /* 工具行吸顶的 top 偏移基准：顶栏实测高写入 --topbar-h（顶栏高随语言/字号环境变，
         不能写死）；语言重渲染、窗口尺寸变化、字体迟到都可能改高，故多处调用点保持同步 */
      function syncTopbarH() {

        /* 理想位置 = 区块中心对齐视口中心（偏差 0）；理想顶边会钻进顶栏之下时钳到 gap
           （顶边永不被顶栏遮住），整块比可用视口还高时同样落到 gap、尽量多露 tile */
        var ideal = Math.round((window.innerHeight - blockH) / 2);

      function scrollAccIntoView(sec) {

            if (!sec.classList.contains("open") || !document.contains(sec)) return;
            var t2 = accTargetY(sec);
            if (Math.abs((window.scrollY || window.pageYOffset || 0) - t2.y) > 2) window.scrollTo(0, t2.y);
          }, 780);

        }

        if (Math.abs(targetY - startY) < 1) return;
        var DUR = 720, t0 = null;
        function frame(ts) {

          if (t < 1) { accScrollRAF = requestAnimationFrame(frame); return; }
          /* 与展开同帧收尾：若终点曾被页面总高钳短，此刻页面已长够，按同一目标公式实测重算贴一次 */
          var t2 = accTargetY(sec);
          if (Math.abs((window.scrollY || window.pageYOffset || 0) - t2.y) > 2) window.scrollTo(0, t2.y);
        }

      }

      /* 图鉴 tile 预热 + 载入淡入：展开动画最忌图片边长边解码——空白 tile 与解码卡顿一起毁掉帧率。
         预热：图鉴区进入视口附近（IntersectionObserver，提前 500px）即把四分类当前面的 tile 全部
         预拉进缓存并 decode；点标题前 pointerdown 再补热本类。淡入：.gcard img 初始透明，
         load 完成（或注入时已在缓存里 complete）才加 .ld 淡入，杜绝半截图/空白闪现。
         展开时长同步定为 720ms（CSS .acc-body 与 scrollAccIntoView 的 DUR 一致），

      var warmedTiles = {};
      function warmTilesFor(k) {
        try {
          var list = visiblePlaces(k);
          var start = (galPages[k] || 0) * PAGE_SIZE;
          list.slice(start, start + PAGE_SIZE).forEach(function (p) {
            var tid = p.id === "kwan-kitchen" ? "kwan-kitchen-pasadena" : p.id;
            var u = "assets/tiles/" + tid + ".jpg";
            if (warmedTiles[u]) return;

        var head = e.target.closest ? e.target.closest(".acc-head") : null;

      document.addEventListener("load", function (e) {
        var t = e.target;
        if (t && t.tagName === "IMG" && t.closest && t.closest(".gcard")) t.classList.add("ld");
      }, true);
      function sweepTileImgs() {
        accordionEl.querySelectorAll(".gcard img").forEach(function (im) {

      accordionEl.addEventListener("click", function (e) {
        var head = e.target.closest ? e.target.closest(".acc-head") : null;
        if (head) {

          var sec = head.parentNode;
          if (openPools[k]) {
            var inner = sec.querySelector(".acc-inner");
            if (inner && !inner.innerHTML) {

          var farr = catFilters[fk2][fdim], fi = farr.indexOf(fv);

        }

      /* 只刷新某分类的 tiles 区 + 命中数行（搜索输入框本身不重渲染，输入焦点与内容不丢） */
      /* 搜索/筛选收窄期间的结果区高度预留（galBaseH = 本类未收窄时网格的最近实测高）：
         收窄渲染前先把当前网格高记下来，收窄后给 .gal-wrap 垫上同高 min-height——
         结果从整面缩到几家甚至 0 家，整页高度也不塌，浏览器没有可钳制的滚动变化，

      accordionEl.addEventListener("transitionend", function (e) {

      /* ---------- 统计 / 次数榜 / 记录 ---------- */
      var histOpen = { day: false, week: false, month: false, year: false };
      function renderStats() {
        $("statTotal").textContent = state.history.length;
        var kinds = Object.keys(state.counts).filter(function (id) { return state.counts[id] > 0; }).length;
        $("statKinds").textContent = kinds + " / " + PLACES.length;
        var top = null, topN = 0;
        PLACES.forEach(function (p) { var c = state.counts[p.id] || 0; if (c > topN) { topN = c; top = p; } });
        var topEl = $("statTop");
        if (top) { topEl.textContent = tt("times", { n: topN }); topEl.title = top.name; }
        else { topEl.textContent = "—"; topEl.title = ""; }
        var ranked = PLACES.filter(function (p) { return (state.counts[p.id] || 0) > 0; })
          .sort(function (a, b) { return (state.counts[b.id] || 0) - (state.counts[a.id] || 0); });
        $("rankWrap").innerHTML = '<div class="gwrap' + (rankOpen ? " open" : "") + '"><div class="gin">' + (ranked.length
          ? '<div class="rank">' + ranked.map(function (p) {
              return '<div class="rank-row"><span class="n">' + esc(p.name) + '</span><span class="c">' + tt("times", { n: state.counts[p.id] || 0 }) + "</span></div>";
            }).join("") + "</div>"

        var rcv = $("rankChev"); if (rcv) rcv.style.transform = rankOpen ? "rotate(90deg)" : "";
        var h = state.history;
        renderClearBlock();
        if (!h.length) { $("historyWrap").innerHTML = '<div class="hempty">' + t("historyEmpty") + "</div>"; $("historyNote").textContent = ""; return; }
        /* 抽卡记录按时间分四组手风琴（最近一天/一周/一个月/一年），默认只展开最近一天 */
        var nowH = Date.now();
        var bandsH = [
          { k: "day", max: 86400000 }, { k: "week", max: 7 * 86400000 }, { k: "month", max: 30 * 86400000 }, { k: "year", max: Infinity }
        ];
        var usedH = {}, gh = "";
        bandsH.forEach(function (bd) {
          var idxs = [];
          h.forEach(function (e, i) { if (!usedH[i] && nowH - e.t <= bd.max) { usedH[i] = 1; idxs.push(i); } });
          if (!idxs.length) return;
          var openH = !!histOpen[bd.k];

          if (res && res.error) return;
          if (uiPrefs.bgImg !== cur) return; /* 期间用户换了图，不覆盖 */
          var pub = sb.storage.from("avatars").getPublicUrl(path);
          var u = pub && pub.data ? pub.data.publicUrl : "";
          if (!u) return;
          uiPrefs.bgImg = u + "?v=" + Date.now();
          saveUiPrefs(); applyBg(); noteStateChange();
        }, function () {});
      }
      function loadProfile() {
        if (!sb) { sbProfile = { id: sbUser.id, display_name: displayNameOf(null, sbUser.email), avatar_url: null, prefs: null }; return Promise.resolve(); }
        return sb.from("profiles").select("*").eq("id", sbUser.id).maybeSingle().then(function (res) {
          if (res && res.data) { sbProfile = res.data; return; }
          /* 触发器没建行时客户端补建自己的一行 */
          var dn = displayNameOf(null, sbUser.email);
          return sb.from("profiles").insert({ id: sbUser.id, display_name: dn }).select().single().then(function (r2) {
            if (r2 && r2.data) sbProfile = r2.data;
            else sbProfile = { id: sbUser.id, display_name: dn, avatar_url: null, prefs: null };
          }, function () { sbProfile = { id: sbUser.id, display_name: dn, avatar_url: null, prefs: null }; });
        }, function () { sbProfile = sbProfile || { id: sbUser.id, display_name: displayNameOf(null, sbUser.email), avatar_url: null, prefs: null }; });
      }
      var spaceAutoTriedFor = "";
      function loadSpaceData() {
        if (!sb || !sbUser) return;
        sb.from("space_members").select("space_id").eq("user_id", sbUser.id).limit(1).then(function (res) {
          var rows = res && res.data ? res.data : [];
          if (!rows.length) {
            if (spaceAutoTriedFor !== sbUser.id) {
              spaceAutoTriedFor = sbUser.id;
              sb.rpc("create_space", { p_name: t("defaultSpaceName") }).then(function (res) {
                if (res && !res.error) { loadSpaceData(); return; }
                sbSpace = null; sbMembers = sbProfile ? [sbProfile] : []; sbVisits = []; sbRatings = {};
                renderSpaceBlock(); renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces();
              }, function () {
                sbSpace = null; sbMembers = sbProfile ? [sbProfile] : []; sbVisits = []; sbRatings = {};
                renderSpaceBlock(); renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces();
              });
              return;
            }
            sbSpace = null; sbMembers = sbProfile ? [sbProfile] : []; sbVisits = []; sbRatings = {};
            renderSpaceBlock(); renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces();
            return;
          }
          var sid = rows[0].space_id;
          sb.from("spaces").select("*").eq("id", sid).maybeSingle().then(function (r2) {
            sbSpace = r2 && r2.data ? r2.data : null;
            if (!sbSpace) { renderSpaceBlock(); renderVisitsBlock(); return; }
            sb.from("space_members").select("user_id").eq("space_id", sid).then(function (r3) {
              var ids = (r3 && r3.data ? r3.data : []).map(function (x) { return x.user_id; });
              if (!ids.length) ids = [sbUser.id];
              sb.from("profiles").select("*").in("id", ids).then(function (r4) {
                sbMembers = r4 && r4.data ? r4.data : [];
                if (!profileByUid(sbUser.id) && sbProfile) sbMembers.push(sbProfile);
                /* 我在前、对方在后，分数 chip 顺序稳定 */
                sbMembers.sort(function (a, b) { return (b.id === sbUser.id ? 1 : 0) - (a.id === sbUser.id ? 1 : 0); });
                renderSpaceBlock();
                loadVisitsData();
              }, function () { renderSpaceBlock(); loadVisitsData(); });
            }, function () { renderSpaceBlock(); loadVisitsData(); });
          }, function () { renderSpaceBlock(); renderVisitsBlock(); });
        }, function () { renderSpaceBlock(); renderVisitsBlock(); });
      }
      function loadVisitsData() {
        if (!sb || !sbSpace) { renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces(); return; }
        /* visits 仍读 visits 表；评分全从 archive blob 取，不再读 ratings 表 */
        sb.from("visits").select("*").eq("space_id", sbSpace.id).order("visited_on", { ascending: false }).order("created_at", { ascending: false }).then(function (res) {
          sbVisits = res && res.data ? res.data : [];
          sbVisits.sort(function (a, b) { if (!a.visited_on && !b.visited_on) return 0; if (!a.visited_on) return 1; if (!b.visited_on) return -1; return 0; });
          renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces();
          reconcileRatings();
        }, function () { renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces(); });
      }
      function clearPrivateData() {
        restSession = null; authStoreSave();
        sbUser = null; sbProfile = null; sbSpace = null; sbMembers = []; sbVisits = []; sbRatings = {};
        sbAuthEmail = ""; sbAuthMode = "login";
        avOpen = false; openPickerVid = null; openPickerSlot = 1; avSlot = 1; avScore = 0; selDay = null; editNameWhich = null; clearOptsOpen = false; avCalOpen = false, avSearchOpen = false;
        if (sbState !== "unavailable") sbState = "out";
        try { localStorage.removeItem(AV_CACHE_KEY); } catch (e) {}
        renderAvatarBtn(); renderAccount(); renderSpaceBlock(); renderVisitsBlock(); refreshMineLines(); refreshPlaceSurfaces();
      }
      function handleSession(session) {
        if (!session || !session.user) { if (sbState === "in") clearPrivateData(); else { sbState = "out"; renderAvatarBtn(); renderAccount(); renderSpaceBlock(); renderVisitsBlock(); } return; }
        var isNew = !sbUser || sbUser.id !== session.user.id;
        sbUser = session.user; sbState = "in";
        /* 任何来源的 session 都镜像进本站 store，下次打开先从这里恢复（不依赖库的存储键） */
        if (session.access_token) {
          restSession = { access_token: session.access_token, refresh_token: session.refresh_token || "", expires_at: session.expires_at || 0, user: session.user };
          authStoreSave();
        }
        sbAuthMode = "login";
        /* 旧邮件链接回跳的 hash 交给 supabase-js 处理完后清掉，不留 token 在地址里 */
        if (window.location.hash && window.location.hash.indexOf("access_token") >= 0) {
          try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
        }
        renderAvatarBtn(); renderAccount(); renderSpaceBlock(); renderVisitsBlock();
        if (isNew) {
          loadProfile().then(function () {
            resolveAccountSync();
            renderAvatarBtn(); renderAccount();
            loadSpaceData();
          });
        }
      }
      function sbGetSessionFallback() {
        if (!sb) return;
        sb.auth.getSession().then(function (res) { handleSession(res && res.data ? res.data.session : null); }, function () { sbState = "out"; renderAvatarBtn(); renderAccount(); renderSpaceBlock(); renderVisitsBlock(); });
      }
      function initAuth() {
        sbProbeHealth(); /* 先探一次活：预热连接 + 给可能的登录报错留自检证据 */
        /* 先恢复本站镜像的 session：没过期直接用，过期用 refresh_token 续；
           都没有才走 shim 的 getSession 收口到未登录态 */
        var saved = authStoreLoad();
        if (saved) {
          restSession = saved;
          if (saved.expires_at && saved.expires_at * 1000 > Date.now() + 30000) applyAuthSession(saved);
          else restRefresh(saved).then(function (st) {
            /* 只有 dead（服务器明确拒绝）才清本地会话并落回未登录；net
               （网络层没打通）时保留镜像、先按已登录渲染，之后每个数据
               请求前的 ensureFreshToken 都会再试续期。旧逻辑任何失败都
               清会话：启动时撞上一次拦截，就把还有效的登录态永久丢掉。 */
            if (st === "dead") { restSession = null; authStoreSave(); sbGetSessionFallback(); }
            else if (st === "net") { applyAuthSession(saved); }
          });
        } else {
          sbGetSessionFallback();
        }
        sb.auth.onAuthStateChange(function (ev, session) {
          if (ev === "SIGNED_OUT") { if (!restSession) clearPrivateData(); return; }
          if (session) handleSession(session);
        });
      }
      /* ---------- 初始化 ---------- */
      applyPlaceLang();
      var lbRestored = tryLbResume();
      renderTabs(); renderPoolBar(); renderRound(); renderStats();
      if (lbRestored) { deferredBoot.push(function () { renderAccordion(); }); setTimeout(flushDeferredBoot, 2200); }
      else renderAccordion();
      syncTopbarH();
      applyBg();
      applyStaticI18n(); renderSwatches(); renderAvatarBtn(); renderAccount(); renderSpaceBlock(); renderVisitsBlock();
      /* 预加载全部卡图，抽卡卡堆出现时不闪白；四张分类插画一并预加载，切换分类时卡背不闪 */
      if (lbRestored) {
        deferredBoot.push(function () { PLACES.forEach(function (p) { var im = new Image(); im.src = p.img; }); });
        deferredBoot.push(function () { POOL_KEYS.forEach(function (k) { var im = new Image(); im.src = POOLS[k].art; }); });
      } else {
        PLACES.forEach(function (p) { var im = new Image(); im.src = p.img; });
        POOL_KEYS.forEach(function (k) { var im = new Image(); im.src = POOLS[k].art; });
      }
      /* 账号系统启动：原生数据客户端就地装配（无外部脚本可等、不会卡在 loading），随即恢复会话。
         syncReady 至此置真：初始化期的归一化落盘不算用户变更（见 syncMeta 注释） */
      syncReady = true;
      sb = makeSbClient();
      initAuth();
    </script>
  </body>
</html>
